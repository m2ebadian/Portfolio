<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mehrshad Bagherebadian</title>
    <meta name="description" content="Mehrshad Bagherebadian: Computer Science student at Michigan State University focused on full-stack development, data science, and AI." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mehrshad Bagherebadian" />
    <meta property="og:description" content="Full-stack, data science, and AI projects, research, and coursework." />
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
